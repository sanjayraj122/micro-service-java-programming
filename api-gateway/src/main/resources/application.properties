spring.application.name=api-gateway

eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
app.eureka-server=localhost
management.endpoints.web.exposure.include=health


# Product service configuration
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

# Order service configuration
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

# Eureka server configuration
spring.cloud.gateway.server.webflux.routes[2].id=registry-server
spring.cloud.gateway.server.webflux.routes[2].uri=http://eureka:password@${app.eureka-server}:8761
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/

spring.cloud.gateway.server.webflux.routes[3].id=discovery-server-static
spring.cloud.gateway.server.webflux.routes[3].uri=http://eureka:password@localhost:8761
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/eureka/**

# Security configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri= http://localhost:8080/realms/myRealm

# server port
# This is the port on which the API Gateway will listen for incoming requests
server.port=8181

#zipkin configuration
spring.zipkin.base-url=http://zipkin:9411
spring.sleuth.sampler.probability=1.0
# Actuator configuration
